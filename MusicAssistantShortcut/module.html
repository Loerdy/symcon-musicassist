<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            min-width: 0;
        }

        body {
            background-color: var(--card-color, transparent);
            container-name: tile;
            container-type: size;
            overflow: hidden;
        }

        .shortcuts {
            --button-background: rgb(255 255 255 / 7%);
            --button-hover: rgb(255 255 255 / 14%);
            --button-border: color-mix(in srgb, currentColor 18%, transparent);
            display: grid;
            /* Spalten und Zeilen setzt layoutGrid(); minmax(0, …) verhindert, dass Bilder die Zeilen über die Kachel hinaus vergrößern. */
            grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr));
            grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
            gap: clamp(6px, 2cqmin, 12px);
            width: 100%;
            height: 100%;
            padding: clamp(6px, 2cqmin, 12px);
            color: var(--content-color, #f3f4f6);
        }

        .shortcuts[data-theme="light"] {
            --button-background: rgb(0 0 0 / 5%);
            --button-hover: rgb(0 0 0 / 10%);
            color: var(--content-color, #202327);
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            align-self: center;
            justify-self: center;
            gap: clamp(4px, 1.5cqmin, 10px);
            /* Quadratische Buttons, Kantenlänge aus layoutGrid(). */
            width: var(--size, 100%);
            height: var(--size, 100%);
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            padding: clamp(6px, 2cqmin, 12px);
            border: 1px solid var(--button-border);
            border-radius: 14px;
            background: var(--button-background);
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .shortcut:hover {
            background: var(--button-hover);
        }

        .shortcut:active,
        .shortcut[data-pressed="true"] {
            border-color: var(--accent-color, currentColor);
            transform: scale(0.97);
        }

        /* Reine Bild-Buttons: das Bild schließt bündig mit dem abgerundeten Rand ab. */
        .shortcut[data-image-only="true"] {
            padding: 0;
            border: 0;
        }

        .shortcut[data-image-only="true"]:active,
        .shortcut[data-image-only="true"][data-pressed="true"] {
            outline: 2px solid var(--accent-color, currentColor);
            outline-offset: -2px;
        }

        .shortcut[data-image-only="true"] img {
            border-radius: 0;
        }

        .shortcut:disabled {
            cursor: default;
            opacity: 0.45;
            transform: none;
        }

        .shortcut svg {
            flex: 1 1 auto;
            width: 100%;
            max-width: 64px;
            min-height: 0;
            max-height: 64px;
            fill: currentColor;
            opacity: 0.85;
        }

        .shortcut img {
            flex: 1 1 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain;
            border-radius: 8px;
        }

        .shortcut span {
            width: 100%;
            overflow: hidden;
            flex: 0 0 auto;
            font-size: clamp(0.75rem, 6cqmin, 1rem);
            line-height: 1.2;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty {
            display: grid;
            place-items: center;
            grid-column: 1 / -1;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="shortcuts" id="shortcuts"></main>

    <template id="icon-radio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6H8.3l8.26-3.34-.68-1.66L3.24 6.13C2.51 6.42 2 7.15 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Zm0 2v3h-2V9h-2v2H4V8h16ZM7 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
    </template>
    <template id="icon-playlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12v2H3V6Zm0 4h12v2H3v-2Zm0 4h8v2H3v-2Zm14-8h4v2h-2v8.5a2.5 2.5 0 1 1-2-2.45V6Z"/></svg>
    </template>

    <script>
        "use strict";

        const container = document.getElementById("shortcuts");

        function detectSymconTheme() {
            const cardColor = getComputedStyle(container).getPropertyValue("--card-color").trim();
            let theme = "dark";
            if (cardColor !== "") {
                const canvas = document.createElement("canvas");
                canvas.width = 1;
                canvas.height = 1;
                const context = canvas.getContext("2d", {willReadFrequently: true});
                if (context) {
                    context.fillStyle = cardColor;
                    context.fillRect(0, 0, 1, 1);
                    const color = context.getImageData(0, 0, 1, 1).data;
                    const linear = [color[0], color[1], color[2]].map((value) => {
                        const channel = value / 255;
                        return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
                    });
                    theme = linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722 > 0.42 ? "light" : "dark";
                }
            }
            container.dataset.theme = theme;
        }

        // Wählt die Spaltenzahl, bei der die Buttons am größten und damit möglichst quadratisch werden.
        function layoutGrid() {
            const count = Math.max(1, Number(container.dataset.count) || 1);
            const style = getComputedStyle(container);
            const width = container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            const height = container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            const gap = parseFloat(style.rowGap) || 0;
            let best = {columns: 1, rows: count, size: -1};
            for (let columns = 1; columns <= count; columns++) {
                const rows = Math.ceil(count / columns);
                const size = Math.min((width - (columns - 1) * gap) / columns, (height - (rows - 1) * gap) / rows);
                if (size > best.size) {
                    best = {columns, rows, size};
                }
            }
            container.style.setProperty("--columns", String(best.columns));
            container.style.setProperty("--rows", String(best.rows));
            container.style.setProperty("--size", Math.max(0, Math.floor(best.size)) + "px");
        }

        function renderState(state) {
            const entries = state && Array.isArray(state.entries) ? state.entries : [];
            container.replaceChildren();
            container.dataset.count = String(entries.length);
            layoutGrid();

            if (entries.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = translate("No entries configured");
                container.append(empty);
                return;
            }

            entries.forEach((entry) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "shortcut";
                const hasImage = typeof entry.image === "string" && entry.image.startsWith("data:image/");
                if (hasImage) {
                    const image = document.createElement("img");
                    image.alt = "";
                    image.src = entry.image;
                    button.append(image);
                } else {
                    const template = document.getElementById(entry.type === "playlist" ? "icon-playlist" : "icon-radio");
                    button.append(template.content.cloneNode(true));
                }
                const text = entry.available ? String(entry.label) : translate("Not available");
                // Ausblenden nur bei vorhandenem Bild, sonst wäre der Button nicht mehr zuzuordnen.
                if (entry.showLabel !== false || !hasImage || entry.available !== true) {
                    const label = document.createElement("span");
                    label.textContent = text;
                    button.append(label);
                } else {
                    button.dataset.imageOnly = "true";
                }
                button.title = text;
                button.setAttribute("aria-label", text);
                button.disabled = entry.available !== true;
                button.addEventListener("click", () => {
                    button.dataset.pressed = "true";
                    window.setTimeout(() => delete button.dataset.pressed, 400);
                    requestAction("Play", Number(entry.index));
                });
                container.append(button);
            });
        }

        function handleMessage(data) {
            let message = data;
            if (typeof message === "string") {
                try {
                    message = JSON.parse(message);
                } catch (error) {
                    return;
                }
            }
            if (message && typeof message === "object" && !Array.isArray(message)) {
                renderState(message);
            }
        }

        const themeObserver = new MutationObserver(detectSymconTheme);
        themeObserver.observe(document.documentElement, {attributes: true, attributeFilter: ["class", "style"]});
        themeObserver.observe(document.head, {childList: true, subtree: true, characterData: true});
        window.addEventListener("focus", detectSymconTheme);
        new ResizeObserver(layoutGrid).observe(container);

        detectSymconTheme();
        renderState(__MUSIC_ASSISTANT_INITIAL_STATE__);
    </script>
</body>
</html>
