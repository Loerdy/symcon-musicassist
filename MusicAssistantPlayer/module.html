<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            min-width: 0;
        }

        body {
            color: inherit;
            background-color: var(--card-color, transparent);
            container-name: tile;
            container-type: size;
            overflow: hidden;
        }

        .player {
            --background-a: linear-gradient(145deg, #25282d 0%, #141619 58%, #0b0c0e 100%);
            --background-b: var(--background-a);
            --control-background: rgb(0 0 0 / 22%);
            --control-hover: color-mix(in srgb, currentColor 16%, transparent);
            --control-border: color-mix(in srgb, currentColor 20%, transparent);
            --select-background: rgb(0 0 0 / 42%);
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-columns: clamp(64px, 27cqi, 128px) minmax(0, 1fr);
            gap: clamp(8px, 3cqi, 18px);
            align-items: center;
            align-content: center;
            width: 100%;
            min-height: 100%;
            padding: clamp(8px, 2.5cqi, 16px);
            overflow: hidden;
            color: #f3f4f6;
            color-scheme: dark;
        }

        .player[data-theme="light"] {
            --control-background: rgb(255 255 255 / 48%);
            --control-hover: rgb(255 255 255 / 72%);
            --control-border: color-mix(in srgb, currentColor 28%, transparent);
            --select-background: rgb(255 255 255 / 62%);
            color: var(--content-color, #202327);
            color-scheme: light;
        }

        .player::before,
        .player::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            content: "";
            pointer-events: none;
            transition: opacity 700ms ease;
        }

        .player::before {
            background: var(--background-a);
            opacity: 1;
        }

        .player::after {
            background: var(--background-b);
            opacity: 0;
        }

        .player[data-background-layer="b"]::before {
            opacity: 0;
        }

        .player[data-background-layer="b"]::after {
            opacity: 1;
        }

        .player[data-status="idle"],
        .player[data-status="unknown"] {
            background-color: var(--card-color, transparent);
        }

        .player[data-status="idle"]::before,
        .player[data-status="idle"]::after,
        .player[data-status="unknown"]::before,
        .player[data-status="unknown"]::after {
            opacity: 0;
        }

        .cover {
            display: block;
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 1;
            align-self: start;
            object-fit: cover;
            border-radius: 10%;
            background: color-mix(in srgb, currentColor 10%, transparent);
            box-shadow: 0 8px 24px rgb(0 0 0 / 24%);
        }

        .cover[hidden] {
            display: none;
        }

        .cover.cover-placeholder {
            border: 0;
            outline: 0;
            background: #202328;
            box-shadow: none;
        }

        .player[data-theme="light"] .cover-placeholder {
            background: color-mix(in srgb, var(--card-color, #e7e9ec) 92%, black);
        }

        .details {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
            max-width: 100%;
        }

        .title,
        .artist {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .title {
            max-width: 100%;
            font-size: clamp(0.95rem, 5cqi, 1.45rem);
            font-weight: 650;
            line-height: 1.2;
        }

        .artist {
            max-width: 100%;
            margin-top: clamp(0.15rem, 0.8cqh, 0.35rem);
            font-size: clamp(0.78rem, 3.8cqi, 1rem);
            opacity: 0.72;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: clamp(0.25rem, 1.6cqh, 0.65rem);
            font-size: 0.78rem;
            opacity: 0.72;
        }

        .status-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            background: #777;
        }

        .player[data-status="playing"] .status-dot {
            background: var(--accent-color);
            box-shadow: 0 0 0.7rem color-mix(in srgb, var(--accent-color) 70%, transparent);
        }

        .player[data-status="paused"] .status-dot {
            background: #e8a838;
        }

        .transport {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.4rem;
            margin-top: clamp(0.3rem, 1.8cqh, 0.7rem);
        }

        .transport button {
            min-width: 0;
            min-height: clamp(1.7rem, 7cqh, 2rem);
            padding: 0.25rem;
            border: 1px solid var(--control-border);
            border-radius: 0.55rem;
            color: inherit;
            background: var(--control-background);
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .transport button:hover,
        .transport button:focus-visible {
            background: var(--control-hover);
        }

        .transport button:active {
            transform: translateY(1px);
        }

        .transport svg,
        .mute-button svg {
            display: block;
            width: 1.1rem;
            height: 1.1rem;
            margin: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .transport svg[hidden],
        .mute-button svg[hidden] {
            display: none;
        }

        .player[data-status="playing"] #transport-toggle {
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 0.65rem color-mix(in srgb, var(--accent-color) 35%, transparent);
        }

        .volume-control {
            display: grid;
            grid-template-columns: 2rem minmax(0, 1fr) 2.8rem;
            gap: 0.5rem;
            align-items: center;
            margin-top: clamp(0.25rem, 1.4cqh, 0.55rem);
        }

        .mute-button {
            width: 2rem;
            height: clamp(1.7rem, 7cqh, 2rem);
            padding: 0;
            border: 1px solid var(--control-border);
            border-radius: 0.55rem;
            color: inherit;
            background: var(--control-background);
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .mute-button:hover,
        .mute-button:focus-visible {
            background: var(--control-hover);
        }

        .player[data-muted="true"] .mute-button {
            color: #e8a838;
            border-color: #e8a838;
        }

        .volume-slider {
            width: 100%;
            min-width: 0;
            accent-color: var(--accent-color);
        }

        .volume-value {
            font-size: 0.75rem;
            text-align: right;
            opacity: 0.72;
        }

        .mode-controls {
            display: none;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.4rem;
            margin-top: clamp(0.25rem, 1.4cqh, 0.55rem);
        }

        .mode-controls button {
            min-width: 0;
            min-height: clamp(1.7rem, 7cqh, 2rem);
            padding: 0.25rem;
            border: 1px solid var(--control-border);
            border-radius: 0.55rem;
            color: inherit;
            background: var(--control-background);
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .mode-controls svg {
            display: block;
            width: 1.1rem;
            height: 1.1rem;
            margin: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #repeat .repeat-one {
            display: none;
        }

        #repeat[data-repeat="one"] .repeat-one {
            display: block;
        }

        .mode-controls button:hover,
        .mode-controls button:focus-visible {
            background: var(--control-hover);
        }

        .mode-controls button[aria-pressed="true"] {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        #repeat[data-repeat="one"],
        #repeat[data-repeat="all"] {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        #favorite[aria-pressed="true"] {
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 0.65rem color-mix(in srgb, var(--accent-color) 35%, transparent);
        }

        .media-selectors {
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.4rem;
            margin-top: clamp(0.25rem, 1.4cqh, 0.55rem);
        }

        .media-selectors select {
            width: 100%;
            min-width: 0;
            height: clamp(1.7rem, 7cqh, 2rem);
            padding: 0 1.6rem 0 0.55rem;
            border: 1px solid var(--control-border);
            border-radius: 0.55rem;
            color: inherit;
            background-color: var(--select-background);
            color-scheme: inherit;
            font: inherit;
            font-size: 0.78rem;
            text-overflow: ellipsis;
        }

        .group-volumes {
            display: none;
            gap: 0.35rem;
            margin-top: clamp(0.35rem, 1.5cqh, 0.75rem);
        }

        .group-volume {
            display: grid;
            grid-template-columns: minmax(4rem, 0.8fr) minmax(0, 1.4fr) 2.8rem;
            gap: 0.5rem;
            align-items: center;
            min-width: 0;
        }

        .group-volume-name {
            overflow: hidden;
            font-size: 0.75rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .group-volume-value {
            font-size: 0.75rem;
            text-align: right;
            opacity: 0.72;
        }

        @container tile (max-width: 280px) {
            .player {
                grid-template-columns: clamp(52px, 25cqi, 64px) minmax(0, 1fr);
                gap: 8px;
                padding: 9px;
            }

            .transport,
            .mode-controls,
            .media-selectors {
                gap: 0.25rem;
            }

            .volume-control {
                grid-template-columns: 1.8rem minmax(0, 1fr) 2.5rem;
                gap: 0.3rem;
            }

            .mute-button {
                width: 1.8rem;
            }
        }

        @container tile (max-height: 259px) {
            .player {
                grid-template-columns: clamp(52px, 42cqh, 92px) minmax(0, 1fr);
                gap: clamp(8px, 4cqh, 11px);
                min-height: 100%;
                padding: clamp(9px, 5cqh, 12px);
            }

            .cover {
                align-self: center;
                box-shadow: 0 2px 6px rgb(0 0 0 / 20%);
            }

            .title {
                font-size: clamp(0.85rem, 7cqh, 1rem);
            }

            .artist {
                margin-top: 0.1rem;
                font-size: clamp(0.7rem, 5.5cqh, 0.82rem);
            }

            .status,
            .transport,
            .volume-control {
                margin-top: clamp(0.15rem, 1.5cqh, 0.25rem);
            }

            .status {
                gap: 0.3rem;
                font-size: 0.7rem;
            }

            .status-dot {
                width: 0.45rem;
                height: 0.45rem;
            }

            .transport {
                gap: 0.3rem;
            }

            .transport button {
                min-height: 1.5rem;
                padding: 0.15rem;
                font-size: 0.9rem;
            }

            .volume-control {
                grid-template-columns: 1.7rem minmax(0, 1fr) 2.5rem;
                gap: 0.35rem;
            }

            .mute-button {
                width: 1.7rem;
                height: 1.5rem;
                font-size: 0.9rem;
            }

            .volume-value {
                font-size: 0.7rem;
            }
        }

        @container tile (min-width: 300px) and (min-height: 260px) {
            .mode-controls,
            .media-selectors {
                display: grid;
            }
        }

        @container tile (min-width: 520px) and (min-height: 420px) {
            .player {
                grid-template-columns: clamp(160px, 32cqi, 260px) minmax(0, 1fr);
                gap: clamp(20px, 4cqi, 36px);
                padding: clamp(16px, 3cqi, 28px);
            }

            .cover,
            .details {
                transform: translateY(clamp(-24px, -3cqh, -12px));
            }

            .cover {
                align-self: start;
            }

            .group-volumes:not([hidden]) {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <main class="player" id="player" data-status="unknown">
        <div class="cover cover-placeholder" id="cover-placeholder" aria-hidden="true"></div>
        <img class="cover" id="cover" alt="" hidden>
        <section class="details">
            <div class="title" id="title">Kein Titel</div>
            <div class="artist" id="artist">–</div>
            <div class="status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="status">Unbekannt</span>
            </div>
            <div class="transport" aria-label="Wiedergabesteuerung">
                <button type="button" data-transport="0" title="Zurück" aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6 9 12l10 6Z"/></svg></button>
                <button type="button" id="transport-toggle" title="Wiedergabe" aria-label="Wiedergabe"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 5v14M15 5v14"/></svg></button>
                <button type="button" data-transport="1" title="Stop" aria-label="Stop">&#x25A0;</button>
                <button type="button" data-transport="4" title="Weiter" aria-label="Weiter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l10 6-10 6Z"/></svg></button>
            </div>
            <div class="volume-control">
                <button type="button" class="mute-button" id="mute" title="Stumm" aria-label="Stumm" aria-pressed="false"><svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4ZM15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></svg><svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5l4.5 4ZM16 9l5 6M21 9l-5 6"/></svg></button>
                <input class="volume-slider" id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Lautstärke">
                <output class="volume-value" id="volume-value" for="volume">0 %</output>
            </div>
            <div class="mode-controls">
                <button type="button" id="shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3"/><path d="m18 15 3 3-3 3"/><path d="M3 18h3c2.1 0 3.6-2.1 5-4.5"/><path d="M13 9.5C14.4 7.4 15.9 6 18 6h3"/><path d="m18 3 3 3-3 3"/></svg></button>
                <button type="button" id="repeat" title="Repeat aus" aria-label="Repeat aus" data-repeat="off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/><path class="repeat-one" d="M12 10v4M10.8 11.2 12 10"/></svg></button>
                <button type="button" id="favorite" title="Favorit" aria-label="Favorit" aria-pressed="false" hidden>&#x2661;</button>
            </div>
            <div class="media-selectors">
                <select id="playlist" aria-label="Playlist"><option value="">Playlist</option></select>
                <select id="radio" aria-label="Radio"><option value="">Radio</option></select>
            </div>
            <div class="group-volumes" id="group-volumes" aria-label="Gruppenlautstärken" hidden></div>
        </section>
    </main>
    <script>
        "use strict";

        const statusLabels = {
            idle: "Gestoppt",
            playing: "Wiedergabe",
            paused: "Pausiert",
            unknown: "Unbekannt"
        };
        const neutralBackgroundDark = "linear-gradient(145deg, #25282d 0%, #141619 58%, #0b0c0e 100%)";
        const neutralBackgroundLight = "linear-gradient(145deg, color-mix(in srgb, var(--card-color, #eef0f2) 88%, white) 0%, color-mix(in srgb, var(--card-color, #e3e6e9) 92%, black) 100%)";
        let analyzedCover = null;
        let failedCover = null;
        let backgroundLayer = "a";
        let coverColor = null;
        let currentTheme = "dark";

        function setBackground(background) {
            const player = document.getElementById("player");
            backgroundLayer = backgroundLayer === "a" ? "b" : "a";
            player.style.setProperty(`--background-${backgroundLayer}`, background);
            player.dataset.backgroundLayer = backgroundLayer;
        }

        function getNeutralBackground() {
            return currentTheme === "light" ? neutralBackgroundLight : neutralBackgroundDark;
        }

        function createCoverBackground(color) {
            const luminance = color[0] * 0.2126 + color[1] * 0.7152 + color[2] * 0.0722;
            const saturationBoost = Math.max(...color) - Math.min(...color) < 8 ? 1.15 : 1.55;
            const saturated = color.map((value) => luminance + (value - luminance) * saturationBoost);
            const saturatedLuminance = saturated[0] * 0.2126
                + saturated[1] * 0.7152
                + saturated[2] * 0.0722;
            const targetLuminance = Math.max(62, Math.min(92, luminance * 1.15));
            const scale = targetLuminance / Math.max(1, saturatedLuminance);
            const accent = saturated.map((value) => Math.round(Math.max(0, Math.min(170, value * scale))));

            if (currentTheme === "light") {
                const upper = accent.map((value) => Math.round(value * 0.45 + 140));
                const lower = accent.map((value) => Math.round(value * 0.2 + 204));
                return `linear-gradient(155deg, rgb(${upper.join(" ")}) 0%, rgb(${lower.join(" ")}) 100%)`;
            }

            const lower = accent.map((value) => Math.round(value * 0.48 + 8));
            return `linear-gradient(155deg, rgb(${accent.join(" ")}) 0%, rgb(${lower.join(" ")}) 100%)`;
        }

        function refreshBackground() {
            setBackground(coverColor === null ? getNeutralBackground() : createCoverBackground(coverColor));
        }

        function detectSymconTheme() {
            const player = document.getElementById("player");
            const cardColor = getComputedStyle(player).getPropertyValue("--card-color").trim();
            let theme = "dark";

            if (cardColor !== "") {
                const canvas = document.createElement("canvas");
                canvas.width = 1;
                canvas.height = 1;
                const context = canvas.getContext("2d", {willReadFrequently: true});
                if (context) {
                    context.clearRect(0, 0, 1, 1);
                    context.fillStyle = cardColor;
                    context.fillRect(0, 0, 1, 1);
                    const color = context.getImageData(0, 0, 1, 1).data;
                    const linear = [color[0], color[1], color[2]].map((value) => {
                        const channel = value / 255;
                        return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
                    });
                    const relativeLuminance = linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722;
                    theme = relativeLuminance > 0.42 ? "light" : "dark";
                }
            }

            if (theme !== currentTheme || player.dataset.theme !== theme) {
                currentTheme = theme;
                player.dataset.theme = theme;
                refreshBackground();
            }
        }

        function analyzeCoverBackground(coverElement, cover) {
            if (cover === analyzedCover) {
                return;
            }
            analyzedCover = cover;

            if (cover === "") {
                coverColor = null;
                refreshBackground();
                return;
            }

            const applyCoverBackground = () => {
                if (analyzedCover !== cover) {
                    return;
                }
                failedCover = null;
                try {
                    const canvas = document.createElement("canvas");
                    const size = 24;
                    canvas.width = size;
                    canvas.height = size;
                    const context = canvas.getContext("2d", {willReadFrequently: true});
                    if (!context) {
                        coverColor = null;
                        refreshBackground();
                        return;
                    }
                    context.drawImage(coverElement, 0, 0, size, size);
                    const pixels = context.getImageData(0, 0, size, size).data;
                    let red = 0;
                    let green = 0;
                    let blue = 0;
                    let weightSum = 0;

                    for (let index = 0; index < pixels.length; index += 4) {
                        if (pixels[index + 3] < 128) {
                            continue;
                        }
                        const maximum = Math.max(pixels[index], pixels[index + 1], pixels[index + 2]);
                        const minimum = Math.min(pixels[index], pixels[index + 1], pixels[index + 2]);
                        const saturation = maximum === 0 ? 0 : (maximum - minimum) / maximum;
                        const luminance = (pixels[index] * 0.2126
                            + pixels[index + 1] * 0.7152
                            + pixels[index + 2] * 0.0722) / 255;
                        const weight = 0.3 + saturation * 1.4 + luminance * 0.65;
                        red += pixels[index] * weight;
                        green += pixels[index + 1] * weight;
                        blue += pixels[index + 2] * weight;
                        weightSum += weight;
                    }

                    if (weightSum === 0) {
                        coverColor = null;
                        refreshBackground();
                        return;
                    }
                    coverColor = [red, green, blue].map((value) => Math.round(value / weightSum));
                    refreshBackground();
                } catch (error) {
                    coverColor = null;
                    refreshBackground();
                }
            };

            if (coverElement.complete && coverElement.naturalWidth > 0) {
                applyCoverBackground();
            } else {
                coverElement.addEventListener("load", applyCoverBackground, {once: true});
                coverElement.addEventListener("error", () => {
                    if (analyzedCover === cover) {
                        failedCover = cover;
                        coverElement.hidden = true;
                        document.getElementById("cover-placeholder").hidden = false;
                        coverColor = null;
                        refreshBackground();
                    }
                }, {once: true});
            }
        }

        function renderOptions(selectId, options, placeholder) {
            const select = document.getElementById(selectId);
            const normalized = Array.isArray(options)
                ? options.filter((option) => option && Number.isInteger(option.value) && option.value > 0
                    && typeof option.label === "string" && option.label !== "")
                    .map((option) => ({value: option.value, label: option.label}))
                : [];
            const signature = JSON.stringify([placeholder, normalized]);
            if (select.dataset.optionsSignature === signature) {
                return;
            }
            select.dataset.optionsSignature = signature;
            select.replaceChildren();

            const emptyOption = document.createElement("option");
            emptyOption.value = "";
            emptyOption.textContent = placeholder;
            select.appendChild(emptyOption);

            normalized.forEach((option) => {
                const element = document.createElement("option");
                element.value = String(option.value);
                element.textContent = option.label;
                select.appendChild(element);
            });
            select.value = "";
            select.disabled = select.options.length <= 1;
        }

        function renderGroupMembers(members) {
            const container = document.getElementById("group-volumes");
            const normalized = Array.isArray(members)
                ? members.filter((member) => member && typeof member.ident === "string" && member.ident !== ""
                    && typeof member.name === "string" && member.name !== ""
                    && Number.isInteger(member.volume) && member.volume >= 0 && member.volume <= 100)
                    .map((member) => ({ident: member.ident, name: member.name, volume: member.volume}))
                : [];
            const structureSignature = JSON.stringify(normalized.map((member) => [member.ident, member.name]));

            if (container.dataset.structureSignature === structureSignature
                && container.childElementCount === normalized.length) {
                const rows = container.querySelectorAll(".group-volume");
                normalized.forEach((member, index) => {
                    const slider = rows[index].querySelector("input");
                    const value = rows[index].querySelector("output");
                    if (!slider || !value) {
                        return;
                    }
                    const incomingVolume = String(member.volume);
                    if (slider.dataset.interacting === "true") {
                        slider.dataset.deferredVolume = incomingVolume;
                        return;
                    }
                    if (slider.dataset.requestedVolume !== undefined
                        && slider.dataset.requestedVolume !== incomingVolume) {
                        slider.dataset.deferredVolume = incomingVolume;
                        return;
                    }
                    if (slider.dataset.requestedVolume === incomingVolume) {
                        if (slider.confirmationTimer !== undefined) {
                            window.clearTimeout(slider.confirmationTimer);
                            delete slider.confirmationTimer;
                        }
                        delete slider.dataset.requestedVolume;
                        delete slider.dataset.deferredVolume;
                    }
                    if (slider.dataset.renderedVolume !== incomingVolume) {
                        slider.value = incomingVolume;
                        slider.dataset.renderedVolume = incomingVolume;
                        value.textContent = `${member.volume} %`;
                    }
                });
                container.hidden = normalized.length === 0;
                return;
            }

            container.dataset.structureSignature = structureSignature;
            container.replaceChildren();
            normalized.forEach((member) => {

                const row = document.createElement("div");
                row.className = "group-volume";

                const name = document.createElement("span");
                name.className = "group-volume-name";
                name.textContent = member.name;
                name.title = member.name;

                const slider = document.createElement("input");
                slider.className = "volume-slider";
                slider.type = "range";
                slider.min = "0";
                slider.max = "100";
                slider.step = "1";
                slider.value = String(member.volume);
                slider.dataset.renderedVolume = String(member.volume);
                slider.setAttribute("aria-label", `Lautstärke ${member.name}`);

                const value = document.createElement("output");
                value.className = "group-volume-value";
                value.textContent = `${member.volume} %`;

                const finishInteraction = () => {
                    delete slider.dataset.interacting;
                    if (slider.dataset.requestedVolume !== undefined) {
                        return;
                    }
                    const synchronizedVolume = slider.dataset.deferredVolume
                        ?? slider.dataset.renderedVolume;
                    delete slider.dataset.deferredVolume;
                    slider.value = synchronizedVolume;
                    slider.dataset.renderedVolume = synchronizedVolume;
                    value.textContent = `${synchronizedVolume} %`;
                };
                slider.addEventListener("pointerdown", () => {
                    slider.dataset.interacting = "true";
                    slider.dataset.interactionStartVolume = slider.value;
                });
                slider.addEventListener("pointerup", () => {
                    if (slider.value === slider.dataset.interactionStartVolume) {
                        finishInteraction();
                    }
                    delete slider.dataset.interactionStartVolume;
                });
                slider.addEventListener("pointercancel", finishInteraction);
                slider.addEventListener("keydown", () => {
                    slider.dataset.interacting = "true";
                });
                slider.addEventListener("input", () => {
                    slider.dataset.interacting = "true";
                    value.textContent = `${slider.value} %`;
                });
                slider.addEventListener("change", () => {
                    const volume = Number(slider.value);
                    if (Number.isInteger(volume) && volume >= 0 && volume <= 100) {
                        delete slider.dataset.interacting;
                        delete slider.dataset.deferredVolume;
                        slider.dataset.requestedVolume = String(volume);
                        if (slider.confirmationTimer !== undefined) {
                            window.clearTimeout(slider.confirmationTimer);
                        }
                        slider.confirmationTimer = window.setTimeout(() => {
                            delete slider.confirmationTimer;
                            if (slider.dataset.requestedVolume !== String(volume)) {
                                return;
                            }
                            const synchronizedVolume = slider.dataset.deferredVolume
                                ?? slider.dataset.renderedVolume;
                            delete slider.dataset.requestedVolume;
                            delete slider.dataset.deferredVolume;
                            slider.value = synchronizedVolume;
                            slider.dataset.renderedVolume = synchronizedVolume;
                            value.textContent = `${synchronizedVolume} %`;
                        }, 1500);
                        requestAction(member.ident, volume);
                    }
                });

                row.append(name, slider, value);
                container.appendChild(row);
            });
            container.hidden = container.childElementCount === 0;
        }

        function renderState(data) {
            if (!data || typeof data !== "object") {
                return;
            }

            const title = typeof data.title === "string" ? data.title : "";
            const artist = typeof data.artist === "string" ? data.artist : "";
            const status = Object.prototype.hasOwnProperty.call(statusLabels, data.status)
                ? data.status
                : "unknown";
            const cover = typeof data.cover === "string"
                && /^data:image\/(?:jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(data.cover)
                ? data.cover
                : "";
            const volume = typeof data.volume === "number" && Number.isFinite(data.volume)
                ? Math.max(0, Math.min(100, Math.round(data.volume)))
                : 0;
            const muted = data.muted === true;
            const shuffle = data.shuffle === true;
            const repeat = ["off", "one", "all"].includes(data.repeat) ? data.repeat : "off";
            const showFavorite = data.showFavorite === true;
            const favorite = data.favorite === true;

            document.getElementById("title").textContent = title || "Kein Titel";
            document.getElementById("artist").textContent = artist || "–";
            document.getElementById("status").textContent = statusLabels[status];
            document.getElementById("player").dataset.status = status;

            const toggleButton = document.getElementById("transport-toggle");
            const isPlaying = status === "playing";
            toggleButton.querySelector(".icon-play").toggleAttribute("hidden", isPlaying);
            toggleButton.querySelector(".icon-pause").toggleAttribute("hidden", !isPlaying);
            toggleButton.title = isPlaying ? "Pause" : "Wiedergabe";
            toggleButton.setAttribute("aria-label", toggleButton.title);

            const volumeElement = document.getElementById("volume");
            const volumeValue = document.getElementById("volume-value");
            const incomingVolume = String(volume);
            volumeElement.dataset.serverVolume = incomingVolume;
            if (volumeElement.dataset.interacting === "true"
                || (volumeElement.dataset.requestedVolume !== undefined
                    && volumeElement.dataset.requestedVolume !== incomingVolume)) {
                volumeElement.dataset.deferredVolume = incomingVolume;
            } else {
                if (volumeElement.dataset.requestedVolume === incomingVolume) {
                    if (volumeElement.confirmationTimer !== undefined) {
                        window.clearTimeout(volumeElement.confirmationTimer);
                        delete volumeElement.confirmationTimer;
                    }
                    delete volumeElement.dataset.requestedVolume;
                    delete volumeElement.dataset.userVolume;
                    delete volumeElement.dataset.deferredVolume;
                }
                volumeElement.value = incomingVolume;
                volumeValue.textContent = `${volume} %`;
            }
            document.getElementById("player").dataset.muted = String(muted);

            const muteButton = document.getElementById("mute");
            muteButton.querySelector(".icon-unmuted").toggleAttribute("hidden", muted);
            muteButton.querySelector(".icon-muted").toggleAttribute("hidden", !muted);
            muteButton.title = muted ? "Ton einschalten" : "Stumm";
            muteButton.setAttribute("aria-label", muteButton.title);
            muteButton.setAttribute("aria-pressed", String(muted));

            const shuffleButton = document.getElementById("shuffle");
            shuffleButton.setAttribute("aria-pressed", String(shuffle));

            const repeatButton = document.getElementById("repeat");
            const repeatLabels = {off: "Repeat aus", one: "Titel wiederholen", all: "Alle wiederholen"};
            repeatButton.dataset.repeat = repeat;
            repeatButton.title = repeatLabels[repeat];
            repeatButton.setAttribute("aria-label", repeatButton.title);

            const favoriteButton = document.getElementById("favorite");
            favoriteButton.hidden = !showFavorite;
            favoriteButton.textContent = favorite ? "\u2665" : "\u2661";
            favoriteButton.setAttribute("aria-pressed", String(favorite));

            renderOptions("playlist", data.playlists, "Playlist");
            renderOptions("radio", data.radios, "Radio");
            renderGroupMembers(data.groupMembers);

            const coverElement = document.getElementById("cover");
            const coverPlaceholder = document.getElementById("cover-placeholder");
            const coverUnavailable = cover === "" || cover === failedCover;
            coverElement.hidden = coverUnavailable;
            coverPlaceholder.hidden = !coverUnavailable;
            if (cover === "") {
                coverElement.removeAttribute("src");
            } else if (cover !== failedCover && coverElement.src !== cover) {
                coverElement.src = cover;
            }
            if (cover !== failedCover) {
                analyzeCoverBackground(coverElement, cover);
            }
        }

        function handleMessage(data) {
            let message = data;
            if (typeof message === "string") {
                try {
                    message = JSON.parse(message);
                } catch (error) {
                    return;
                }
            }
            if (!message || typeof message !== "object" || Array.isArray(message)) {
                return;
            }
            renderState(message);
        }

        document.querySelectorAll("[data-transport]").forEach((button) => {
            button.addEventListener("click", () => {
                requestAction("Transport", Number(button.dataset.transport));
            });
        });
        document.getElementById("transport-toggle").addEventListener("click", () => {
            const value = document.getElementById("player").dataset.status === "playing" ? 3 : 2;
            requestAction("Transport", value);
        });
        const volumeElement = document.getElementById("volume");
        const volumeValue = document.getElementById("volume-value");
        volumeElement.addEventListener("pointerdown", () => {
            volumeElement.dataset.interacting = "true";
        });
        volumeElement.addEventListener("pointerup", () => {
            if (volumeElement.dataset.requestedVolume === undefined
                && volumeElement.dataset.userVolume === undefined) {
                delete volumeElement.dataset.interacting;
            }
        });
        volumeElement.addEventListener("pointercancel", () => {
            delete volumeElement.dataset.interacting;
            delete volumeElement.dataset.userVolume;
            if (volumeElement.dataset.requestedVolume !== undefined) {
                volumeElement.value = volumeElement.dataset.requestedVolume;
                volumeValue.textContent = `${volumeElement.dataset.requestedVolume} %`;
                return;
            }
            if (volumeElement.confirmationTimer !== undefined) {
                window.clearTimeout(volumeElement.confirmationTimer);
                delete volumeElement.confirmationTimer;
            }
            const synchronizedVolume = volumeElement.dataset.deferredVolume
                ?? volumeElement.dataset.serverVolume
                ?? volumeElement.value;
            delete volumeElement.dataset.deferredVolume;
            volumeElement.value = synchronizedVolume;
            volumeValue.textContent = `${synchronizedVolume} %`;
        });
        volumeElement.addEventListener("keydown", (event) => {
            if (["ArrowDown", "ArrowLeft", "ArrowRight", "ArrowUp", "End", "Home", "PageDown", "PageUp"]
                .includes(event.key)) {
                volumeElement.dataset.interacting = "true";
            }
        });
        volumeElement.addEventListener("input", (event) => {
            volumeElement.dataset.userVolume = event.target.value;
            volumeValue.textContent = `${event.target.value} %`;
        });
        volumeElement.addEventListener("change", (event) => {
            const requestedVolume = Number(volumeElement.dataset.userVolume ?? event.target.value);
            delete volumeElement.dataset.interacting;
            if (!Number.isInteger(requestedVolume) || requestedVolume < 0 || requestedVolume > 100) {
                return;
            }
            volumeElement.value = String(requestedVolume);
            volumeValue.textContent = `${requestedVolume} %`;
            volumeElement.dataset.requestedVolume = String(requestedVolume);
            if (volumeElement.confirmationTimer !== undefined) {
                window.clearTimeout(volumeElement.confirmationTimer);
            }
            volumeElement.confirmationTimer = window.setTimeout(() => {
                delete volumeElement.confirmationTimer;
                if (volumeElement.dataset.requestedVolume !== String(requestedVolume)) {
                    return;
                }
                const synchronizedVolume = volumeElement.dataset.deferredVolume
                    ?? volumeElement.dataset.serverVolume
                    ?? String(requestedVolume);
                delete volumeElement.dataset.requestedVolume;
                delete volumeElement.dataset.userVolume;
                delete volumeElement.dataset.deferredVolume;
                volumeElement.value = synchronizedVolume;
                volumeValue.textContent = `${synchronizedVolume} %`;
            }, 1500);
            requestAction("VolumeLevel", requestedVolume);
        });
        document.getElementById("mute").addEventListener("click", () => {
            const muted = document.getElementById("player").dataset.muted === "true";
            requestAction("Mute", !muted);
        });
        document.getElementById("shuffle").addEventListener("click", (event) => {
            requestAction("Shuffle", event.currentTarget.getAttribute("aria-pressed") !== "true");
        });
        document.getElementById("repeat").addEventListener("click", (event) => {
            const modes = ["off", "one", "all"];
            const current = modes.indexOf(event.currentTarget.dataset.repeat);
            requestAction("Repeat", modes[(current + 1) % modes.length]);
        });
        document.getElementById("favorite").addEventListener("click", (event) => {
            if (!event.currentTarget.hidden) {
                requestAction("Favorite", event.currentTarget.getAttribute("aria-pressed") !== "true");
            }
        });
        document.getElementById("playlist").addEventListener("change", (event) => {
            const itemId = Number(event.target.value);
            if (Number.isInteger(itemId) && itemId > 0) {
                requestAction("Playlist", itemId);
            }
            event.target.value = "";
        });
        document.getElementById("radio").addEventListener("change", (event) => {
            const itemId = Number(event.target.value);
            if (Number.isInteger(itemId) && itemId > 0) {
                requestAction("Radio", itemId);
            }
            event.target.value = "";
        });

        const themeObserver = new MutationObserver(detectSymconTheme);
        themeObserver.observe(document.documentElement, {attributes: true, attributeFilter: ["class", "style"]});
        themeObserver.observe(document.body, {attributes: true, attributeFilter: ["class", "style"]});
        themeObserver.observe(document.head, {childList: true, subtree: true, characterData: true});
        window.addEventListener("focus", detectSymconTheme);
        window.addEventListener("pageshow", detectSymconTheme);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                detectSymconTheme();
            }
        });

        detectSymconTheme();
        renderState(__MUSIC_ASSISTANT_INITIAL_STATE__);
    </script>
</body>
</html>
